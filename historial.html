<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Historial - Temps</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0a84ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default">
</head>

<body>

<div class="app">

    <h1>📋 Historial</h1>

    <div id="llistaHistorial"></div>

    <button
        class="primari"
        onclick="location.href='index.html'">

        ⬅ Tornar

    </button>

</div>


<!-- NOU REGISTRE -->

<div id="modalNou" class="modal ocult">

    <div class="finestra">

        <h2>➕ Nou registre</h2>

        <label>Activitat</label>

        <input
            id="novaActivitat"
            type="text"
            readonly>


        <label>Data d'entrada</label>

        <input
            id="novaDataEntrada"
            type="date">


        <label>Hora d'entrada</label>

        <input
            id="novaEntrada"
            type="time">


        <label>Data de sortida</label>

        <input
            id="novaDataSortida"
            type="date">


        <label>Hora de sortida</label>

        <input
            id="novaSortida"
            type="time">


        <button
            id="guardarNou"
            class="verd">

            💾 Guardar

        </button>


        <button
            id="cancelarNou"
            class="vermell">

            Cancel·lar

        </button>

    </div>

</div>


<!-- EDITAR REGISTRE -->

<div id="modalEditar" class="modal ocult">

    <div class="finestra">

        <h2>✏️ Editar registre</h2>

        <label>Activitat</label>

        <input
            id="editActivitat"
            type="text"
            readonly>


        <label>Data i hora d'entrada</label>

        <input
            id="editInici"
            type="datetime-local">


        <label>Data i hora de sortida</label>

        <input
            id="editFinal"
            type="datetime-local">


        <button
            id="guardarEdit"
            class="verd">

            💾 Guardar canvis

        </button>


        <button
            id="cancelarEdit"
            class="vermell">

            Cancel·lar

        </button>

    </div>

</div>


<script src="dades.js"></script>
<script src="historial.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>

</html>
